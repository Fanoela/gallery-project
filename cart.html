<!DOCTYPE html>
<html>
<head>
	<title>Shopping Cart</title>
	<link rel="stylesheet" href="style.css">
</head>

<body>

<header>
	<h1 id="main-title">My Shopping list</h1>

	<nav>
		<ul>
			<li><a href="index.html">Home</a></li>
			<li><a href="#">My Cart</a></li>
			<li><a href="#footer">Contact us</a></li>
			<li><a href="login.html">Log in</a></li>
		</ul>
	</nav>
</header>

<main>
	<div class="grid-container" id="cart-items"> 


	</div>
	
	<h2>Total: <span id='totalPrice'>0</span>$</h2>
	<br><br>
	
	<div id = "lastBtn">
	
	<a onclick = "show(event)" href="#" class="btn" id="pay">Confirm your purchase</a>
	<a href = "#" class="btn" onclick="emptyCart()">Empty cart</a>

	</div>

    <section id="checkout" class="formulaire hidden">
    <form>
    <input type="text" id="fullName" placeholder="enter your full name" required>
	<input type="text" placeholder="email" required>
    <input type="text" id="address" placeholder="your address" required>
	<input type="text" id="cardNum" placeholder="enter your card number" required>
	<input type="text" placeholder="MM/YY" required>
    <input type="text" placeholder="CVC" required>
    <input type="submit" id="confirm" name="action" class="btn pay" value="Confirm">    
    </form>
	</section>





</main>


<footer id="footer">
<p>skyart@artwork.com</p>
<p> The Sky ArtWork Gallery </p>
<p> 2026 Copyright </p>
</footer>


<script src="js/cart.js"></script>
<script>
	function show(event)
	{
		event.preventDefault();
		const payment = document.getElementById('checkout');
		payment.classList.remove('hidden')
	}
</script>
<script src="js/checkout.js"></script>


</body>
</html>
